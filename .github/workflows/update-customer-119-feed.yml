name: Update Open Range Trailer Sales Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add HTT location ID
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = "open-range-trailer-sales.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          dealerids = [
              (elem.text or "").strip()
              for elem in root.iter("dealerid")
          ]

          if "875" not in dealerids:
              raise SystemExit("ERROR: Expected dealer ID 875 was not found.")

          locations = list(root.iter("location"))

          if not locations:
              raise SystemExit("ERROR: No locations found in feed.")

          changed = 0

          for location in locations:
              locationid = location.find("locationid")

              if locationid is None:
                  locationid = ET.SubElement(location, "locationid")

              current = (locationid.text or "").strip()

              if current != "30119":
                  locationid.text = "30119"
                  changed += 1

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Dealer ID confirmed: 875")
          print("Locations found:", len(locations))
          print("Locations changed:", changed)
          print("All Open Range locations assigned HTT location ID 30119")
          PY
          
      - name: Validate XML and stock numbers
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          path = "open-range-trailer-sales.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          print("XML validated successfully")

          stocknumbers = []

          for elem in root.iter("stocknumber"):
              value = (elem.text or "").strip()
              if value:
                  stocknumbers.append(value)

          counts = Counter(stocknumbers)
          duplicates = [x for x, count in counts.items() if count > 1]

          print("Stock numbers found:", len(stocknumbers))
          print("Unique stock numbers:", len(counts))

          if duplicates:
              print("WARNING - duplicate stock numbers:")
              for x in duplicates:
                  print(x)
          else:
              print("No duplicate stock numbers found.")
          PY

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add open-range-trailer-sales.xml

          if git diff --cached --quiet; then
            echo "Feed has not changed."
          else
            git commit -m "Update Open Range Trailer Sales feed"
            git push
          fi
