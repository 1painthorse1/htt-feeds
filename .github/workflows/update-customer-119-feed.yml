name: Update Open Range Trailer Sales Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Datalink XML
        run: |
          curl --fail --location --silent --show-error \
            --output open-range-trailer-sales.xml \
            'https://api.datalink.ai/api/inventories-export/364?customerId=119&type=xml&refresh=auto'

      - name: Add HTT location ID
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("open-range-trailer-sales.xml")
          text = path.read_text(encoding="utf-8")

          if "<dealerid>875</dealerid>" not in text:
              raise SystemExit("ERROR: Expected dealer ID 875 was not found.")

          text, replacements = re.subn(
              r"<locationid\s*/>|<locationid>\s*</locationid>",
              "<locationid>30119</locationid>",
              text,
              count=1
          )

          if replacements != 1:
              raise SystemExit("ERROR: Could not find blank location ID.")

          path.write_text(text, encoding="utf-8")

          print("Dealer ID confirmed: 875")
          print("Location ID inserted: 30119")
          PY

      - name: Validate XML and stock numbers
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          path = "open-range-trailer-sales.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          print("XML validated successfully")

          stocknumbers = []

          for elem in root.iter("stocknumber"):
              value = (elem.text or "").strip()
              if value:
                  stocknumbers.append(value)

          counts = Counter(stocknumbers)
          duplicates = [x for x, count in counts.items() if count > 1]

          print("Stock numbers found:", len(stocknumbers))
          print("Unique stock numbers:", len(counts))

          if duplicates:
              print("WARNING - duplicate stock numbers:")
              for x in duplicates:
                  print(x)
          else:
              print("No duplicate stock numbers found.")
          PY

      - name: Save updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add open-range-trailer-sales.xml

          if git diff --cached --quiet; then
            echo "Feed has not changed."
          else
            git commit -m "Update Open Range Trailer Sales feed"
            git push
          fi
