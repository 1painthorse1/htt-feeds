name: Update Arena Trailers Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Arena feed with retry
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import time

          url = "https://api.datalink.ai/api/inventories-export/364?customerId=763&type=xml&refresh=auto"
          output = Path("arena-trailers.xml")

          for attempt in range(1, 11):
              print(f"Attempt {attempt} of 10...")

              try:
                  request = Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urlopen(request, timeout=60) as response:
                      data = response.read()

                  root = ET.fromstring(data)

                  if root.tag.lower() == "error":
                      print("Datalink says:", (root.text or "").strip())

                  elif root.find(".//dealerid") is None:
                      print("Feed not ready: dealer ID not found.")

                  elif root.find(".//inventoryitem") is None:
                      print("Feed not ready: inventory items not found.")

                  else:
                      dealer_id = (root.findtext(".//dealerid") or "").strip()
                      location_id = (root.findtext(".//locationid") or "").strip()

                      print("Datalink dealer ID:", dealer_id)
                      print("Datalink location ID:", location_id)

                      if dealer_id not in {"21", "16"}:
                          raise SystemExit(
                              f"ERROR: Unexpected dealer ID: {dealer_id}"
                          )

                      if location_id != "21":
                          raise SystemExit(
                              f"ERROR: Unexpected location ID: {location_id}"
                          )

                      # Work with the raw XML text so description formatting,
                      # CDATA and &#13; line breaks are preserved.
                      text = data.decode("utf-8")

                      if dealer_id == "21":
                          text = text.replace(
                              "<dealerid>21</dealerid>",
                              "<dealerid>16</dealerid>",
                              1
                          )

                      output.write_text(text, encoding="utf-8")

                      print("Valid Arena inventory feed downloaded.")
                      print("HTT dealer ID set to 16.")
                      print("HTT location ID set to 21.")
                      break

              except SystemExit:
                  raise

              except Exception as e:
                  print("Download attempt failed:", e)

              if attempt < 10:
                  print("Waiting 30 seconds before trying again...")
                  time.sleep(30)

          else:
              raise SystemExit(
                  "ERROR: Datalink did not return a completed inventory feed after 10 attempts."
              )
          PY

      - name: Validate final Arena XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          path = "arena-trailers.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          dealer_id = (root.findtext(".//dealerid") or "").strip()
          dealer_name = (root.findtext(".//dealername") or "").strip()
          location_id = (root.findtext(".//locationid") or "").strip()
          location_name = (root.findtext(".//locationname") or "").strip()

          print("Dealer ID:", dealer_id)
          print("Dealer Name:", dealer_name)
          print("Location ID:", location_id)
          print("Location Name:", location_name)

          if dealer_id != "16":
              raise SystemExit("ERROR: Final dealer ID is not 16.")

          if location_id != "21":
              raise SystemExit("ERROR: Final location ID is not 21.")

          stocknumbers = []

          for elem in root.iter("stocknumber"):
              value = (elem.text or "").strip()
              if value:
                  stocknumbers.append(value)

          counts = Counter(stocknumbers)
          duplicates = [
              stock for stock, count in counts.items()
              if count > 1
          ]

          print("Stock numbers found:", len(stocknumbers))
          print("Unique stock numbers:", len(counts))

          if duplicates:
              print("WARNING - duplicate stock numbers:")
              for stock in duplicates:
                  print(stock)
          else:
              print("No duplicate stock numbers found.")

          print("Arena XML validated successfully.")
          PY

      - name: Save Arena feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add arena-trailers.xml

          if git diff --cached --quiet; then
            echo "Arena feed has not changed."
          else
            git commit -m "Update Arena Trailers feed"
            git push
          fi
