      - name: Download Trailer Funnel XML
        run: |
          URL='https://api.datalink.ai/api/inventories-export/364?customerId=1763&type=xml&refresh=auto'

          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt of 5..."

            if curl --fail --location --silent --show-error \
              --output congelosi-temp.xml \
              "$URL"; then

              if python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "congelosi-temp.xml"

          try:
              tree = ET.parse(path)
              root = tree.getroot()
          except Exception as e:
              print("Downloaded file is not valid XML:", e)
              sys.exit(1)

          dealers = list(root.iter("dealer"))
          locations = list(root.iter("location"))
          inventory = list(root.iter("inventoryitem"))

          print("Root element:", root.tag)
          print("Dealers found:", len(dealers))
          print("Locations found:", len(locations))
          print("Inventory items found:", len(inventory))

          if root.tag == "feedimport" and dealers and locations and inventory:
              print("Complete Trailer Funnel feed received.")
              sys.exit(0)

          print("Feed is incomplete. Will retry.")
          sys.exit(1)
          PY
              then
                mv congelosi-temp.xml congelosi-trailer-sales.xml
                echo "Congelosi feed downloaded successfully."
                exit 0
              fi
            fi

            echo "Waiting 15 seconds before trying again..."
            sleep 15
          done

          echo "ERROR: Complete Congelosi feed was not received after 5 attempts."
          exit 1
